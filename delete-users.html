<!DOCTYPE html>
<html>
<head>
    <title>Delete All Users</title>
</head>
<body>
    <h1>Delete All Users</h1>
    <button onclick="deleteUsers()">Delete All Users</button>
    <div id="result"></div>
    
    <script>
        async function deleteUsers() {
            try {
                const response = await fetch('http://localhost:8000/api/v1/user/admin/delete-all', {
                    method: 'DELETE',
                    credentials: 'include',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });
                
                const result = await response.json();
                document.getElementById('result').innerHTML = 
                    '<h3>Result: ' + JSON.stringify(result) + '</h3>';
            } catch (error) {
                document.getElementById('result').innerHTML = 
                    '<h3 style="color: red;">Error: ' + error.message + '</h3>';
            }
        }
    </script>
</body>
</html>
